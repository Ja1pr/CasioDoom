# Builds CasioDoom.g1a with the fxSDK and runs the PC regression test.
#
# The cross toolchain (binutils + GCC for SuperH) and gint are installed
# with GiteaPC from the Planète Casio forge, which takes a while the first
# time; the result is cached.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the PC test harness
        run: make -C src/host
      - name: Check that the WAD converter starts
        run: python3 tools/wad2calc.py --help

  addin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl pkg-config \
            python3 python3-pil libgmp-dev libmpfr-dev libmpc-dev libpng-dev \
            libusb-1.0-0-dev libsdl2-dev libudisks2-dev libglib2.0-dev \
            libncurses-dev texinfo flex bison
      - name: Cache the fxSDK
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
          key: fxsdk-${{ runner.os }}-v1
      - name: Install the fxSDK (GiteaPC)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          curl "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" -o /tmp/giteapc-install.sh
          yes | bash /tmp/giteapc-install.sh
          yes | giteapc install Lephenixnoir/fxsdk:noudisks2 Lephenixnoir/sh-elf-binutils Lephenixnoir/sh-elf-gcc
          yes | giteapc install Lephenixnoir/OpenLibm Vhex-Kernel-Core/fxlibc Lephenixnoir/gint
      - name: Build the add-in
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fxsdk build-fx
      - uses: actions/upload-artifact@v4
        with:
          name: CasioDoom
          path: CasioDoom.g1a
